name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest
        run: pytest

  release-assets:
    name: Upload develop assets to release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release metadata
        run: |
          echo "RELEASE_TAG=develop-assets-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=develop assets ${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Archive assets
        run: |
          cd pulsar2-doc-search
          zip -r "../${RELEASE_TAG}.zip" assets

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: develop
          prerelease: true
          make_latest: false
          files: ${{ env.RELEASE_TAG }}.zip
